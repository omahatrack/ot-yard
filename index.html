<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OT Yard">
<title>Jacob – Omaha Track</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
:root{
  --red:#C0201A;--red-dk:#8B1511;--red-bg:#FDECEA;
  --amber:#BA7517;--amber-bg:#FAEEDA;
  --green:#3B6D11;--green-bg:#EAF3DE;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --purple:#534AB7;--purple-bg:#EEEDFE;
  --gray:#5F5E5A;--gray-bg:#F1EFE8;
  --bg:#F5F3EF;--surface:#fff;--border:rgba(0,0,0,0.1);
  --text:#1A1A18;--muted:#6B6B67;--hint:#9B9B96;
  --r:12px;--rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;padding-bottom:80px;min-height:100vh;}

.header{background:var(--red);color:#fff;padding:48px 18px 14px;position:sticky;top:0;z-index:30;}
.header h1{font-size:20px;font-weight:600;letter-spacing:-.2px;}
.header-sub{font-size:11px;opacity:.65;margin-top:2px;font-family:'DM Mono',monospace;}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;opacity:.5;margin-left:6px;vertical-align:middle;}
.sync-dot.live{opacity:1;background:#7CFC00;}
.sync-dot.saving{background:#FFD700;opacity:1;}

.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:78px;z-index:29;}
.tab{flex:1;padding:11px 4px 9px;font-size:11px;font-weight:500;color:var(--hint);border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s;font-family:'DM Sans',sans-serif;}
.tab i{font-size:22px;}
.tab.active{color:var(--red);border-bottom-color:var(--red);}

.panel{display:none;padding:14px;}
.panel.active{display:block;}
.sec{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin:0 0 9px;font-family:'DM Mono',monospace;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:3px 14px;margin-bottom:12px;}

.day-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.day-lbl{font-size:19px;font-weight:600;letter-spacing:-.3px;}
.day-sub{font-size:11px;color:var(--hint);margin-top:2px;font-family:'DM Mono',monospace;}
.ring-wrap{position:relative;width:42px;height:42px;flex-shrink:0;}
.ring-wrap svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--red);font-family:'DM Mono',monospace;}

.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);user-select:none;}
.task-row:last-child{border-bottom:none;}
.chk{width:21px;height:21px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:all .15s;cursor:pointer;}
.chk.done{background:var(--green);border-color:var(--green);}
.chk i{display:none;font-size:13px;color:#fff;}
.chk.done i{display:block;}
.task-body{flex:1;min-width:0;cursor:pointer;}
.task-txt{font-size:13px;line-height:1.4;color:var(--text);}
.task-txt.done{color:var(--hint);text-decoration:line-through;}
.task-meta{display:flex;gap:5px;margin-top:3px;align-items:center;flex-wrap:wrap;}
.tag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;font-family:'DM Mono',monospace;white-space:nowrap;}
.tag-truck{background:var(--amber-bg);color:var(--amber);}
.tag-rail{background:var(--gray-bg);color:var(--gray);}
.tag-weigh{background:var(--blue-bg);color:var(--blue);}
.tag-saw{background:var(--purple-bg);color:var(--purple);}
.tag-sort{background:var(--green-bg);color:var(--green);}
.tag-safety{background:var(--red-bg);color:var(--red-dk);}
.expand-btn{font-size:10px;color:var(--red);background:none;border:none;cursor:pointer;padding:0;font-family:'DM Mono',monospace;white-space:nowrap;}
.del-btn{background:none;border:none;cursor:pointer;color:var(--hint);padding:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.del-btn:active{color:var(--red);}
.del-btn i{font-size:14px;}

.subtask-panel{background:var(--bg);border-radius:var(--rs);margin:4px 0 6px 30px;padding:4px 10px;border:1px solid var(--border);}
.sub-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);}
.sub-row:last-child{border-bottom:none;}
.sub-chk{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;background:var(--surface);transition:all .15s;cursor:pointer;}
.sub-chk.done{background:var(--green);border-color:var(--green);}
.sub-chk i{display:none;font-size:10px;color:#fff;}
.sub-chk.done i{display:block;}
.sub-txt{font-size:12px;line-height:1.4;color:var(--muted);cursor:pointer;}
.sub-txt.done{color:var(--hint);text-decoration:line-through;}

.add-area{margin-top:10px;}
.tag-sel{display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap;}
.tag-opt{font-size:10px;font-weight:500;padding:3px 8px;border-radius:20px;border:1.5px solid transparent;cursor:pointer;font-family:'DM Mono',monospace;opacity:.4;transition:opacity .1s;}
.tag-opt.sel{opacity:1;border-color:currentColor;}
.tag-opt.tag-truck{background:var(--amber-bg);color:var(--amber);}
.tag-opt.tag-rail{background:var(--gray-bg);color:var(--gray);}
.tag-opt.tag-weigh{background:var(--blue-bg);color:var(--blue);}
.tag-opt.tag-saw{background:var(--purple-bg);color:var(--purple);}
.tag-opt.tag-sort{background:var(--green-bg);color:var(--green);}
.tag-opt.tag-safety{background:var(--red-bg);color:var(--red-dk);}
.add-row{display:flex;gap:7px;}
.add-row input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rs);font-size:13px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);outline:none;}
.add-row input:focus{border-color:var(--red);}
.add-row input::placeholder{color:var(--hint);}
.add-btn{width:42px;height:42px;border:none;border-radius:var(--rs);background:var(--red);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.add-btn:active{opacity:.75;}
.add-btn i{font-size:20px;}

.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
.dc{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:var(--rs);border:1px solid var(--border);cursor:pointer;background:var(--surface);}
.dc.today{background:var(--red);border-color:var(--red);}
.dc.sel:not(.today){border-color:var(--red);background:var(--red-bg);}
.dc-d{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);font-family:'DM Mono',monospace;}
.dc.today .dc-d{color:rgba(255,255,255,.7);}
.dc.sel:not(.today) .dc-d{color:var(--red);}
.dc-n{font-size:14px;font-weight:600;color:var(--text);}
.dc.today .dc-n{color:#fff;}
.dc.sel:not(.today) .dc-n{color:var(--red);}
.dc-dot{width:5px;height:5px;border-radius:50%;}
.dc.has-t:not(.today) .dc-dot{background:var(--red);}
.dc.today .dc-dot{background:rgba(255,255,255,.5);}

.empty{font-size:13px;color:var(--hint);padding:14px 0;text-align:center;}
.edit-input{font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--surface);border:1px solid var(--red);border-radius:5px;padding:2px 6px;width:100%;outline:none;line-height:1.4;}
.sub-edit-input{font-size:12px;font-family:'DM Sans',sans-serif;color:var(--muted);background:var(--surface);border:1px solid var(--red);border-radius:4px;padding:2px 6px;width:100%;outline:none;line-height:1.4;}

.new-task-badge{background:var(--red-bg);border:1px solid rgba(192,32,26,.2);border-radius:var(--rs);padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--red-dk);display:none;}
.new-task-badge.show{display:block;}
</style>
</head>
<body>

<div class="header">
  <h1>Jacob — Omaha Track <span class="sync-dot" id="sync-dot"></span></h1>
  <div class="header-sub" id="hdr-sub">WECO/Millard Yard · Omaha, NE</div>
</div>

<div class="tab-bar">
  <button class="tab active" onclick="sw('tasks',this)"><i class="ti ti-checklist"></i>Today</button>
  <button class="tab" onclick="sw('week',this)"><i class="ti ti-calendar"></i>Week</button>
</div>

<div class="panel active" id="panel-tasks">
  <div class="day-hd">
    <div>
      <div class="day-lbl" id="today-lbl">—</div>
      <div class="day-sub" id="today-sub">—</div>
    </div>
    <div class="ring-wrap">
      <svg width="42" height="42" viewBox="0 0 42 42">
        <circle cx="21" cy="21" r="17" fill="none" stroke="var(--bg)" stroke-width="4"/>
        <circle id="ring-c" cx="21" cy="21" r="17" fill="none" stroke="var(--red)" stroke-width="4" stroke-dasharray="107" stroke-dashoffset="107" stroke-linecap="round"/>
      </svg>
      <div class="ring-num" id="ring-n">0%</div>
    </div>
  </div>
  <div class="new-task-badge" id="new-task-badge">📋 New tasks added by manager — pull down to refresh</div>
  <div class="card" id="task-list"></div>
  <div class="add-area">
    <div class="tag-sel" id="tag-sel"></div>
    <div class="add-row">
      <input type="text" id="new-input" placeholder="Add a task..."/>
      <button class="add-btn" onclick="addTask()"><i class="ti ti-plus"></i></button>
    </div>
  </div>
</div>

<div class="panel" id="panel-week">
  <p class="sec">This week</p>
  <div class="week-grid" id="week-grid"></div>
  <p class="sec" id="wk-lbl">Monday tasks</p>
  <div class="card" id="wk-tasks"></div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCf4EkFDmEUrVFyKZdNivTKBmheEdqYlVk",
  authDomain: "omaha-track-yard.firebaseapp.com",
  databaseURL: "https://omaha-track-yard-default-rtdb.firebaseio.com",
  projectId: "omaha-track-yard",
  storageBucket: "omaha-track-yard.firebasestorage.app",
  messagingSenderId: "22660188346",
  appId: "1:22660188346:web:7f4f12e7676cfdec4a9a83"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const today=new Date();
const DOW=today.getDay();
const dateKey=today.toISOString().slice(0,10); // YYYY-MM-DD

const SUBTASKS={
  truck:['Confirm material type with yard manager (plug rail or scrap)','Spot truck in loading position','Inspect forks & attachment before loading','Load material onto truck — check weight distribution','Secure load — verify nothing is loose or unstable','Give truck driver the all-clear','Log load in yard record'],
  rail:['Receive move instructions from yard manager','Verify blue flag status — confirm car is clear to move','Visually inspect railcar before moving','Position forklift for safe approach','Execute move to designated track/spot','Confirm car is properly spotted and chocked if needed','Radio yard manager — move complete'],
  weigh:['Confirm railcar ID / car number with yard manager','Position car at scale — ensure car is fully on scale','Record gross weight','Subtract tare weight to get net weight','Log weight to yard record / scale ticket','Notify yard manager or scale house of final weight','Move car off scale when complete'],
  saw:['Confirm rail size and cut lengths with yard manager','Load rail onto saw house feed','Set saw to correct cut length','Perform cut — follow all saw safety procedures','Grade cut rail pieces as instructed','Stack and sort cut rail to correct bin','Clean up cuttings from saw area'],
  sort:['Identify material type (tie plates, joint bars, anchors, rail)','Confirm correct bin assignment with yard manager','Sort material to assigned bins — check for mislabeled items','Verify bin is not over capacity','Clean up any spilled material from sorting area'],
  safety:['Wear all required PPE','Walk the work area — identify hazards','Radio is charged and on correct channel','Report any issues to yard manager immediately'],
};

const DEF_TASKS={
  1:[{text:'Sort incoming materials — tie plates, joint bars, anchors',tag:'sort'},{text:'Move / spot railcars as directed',tag:'rail'},{text:'Load trucks with plug rail',tag:'truck'},{text:'Weigh railcars at scale',tag:'weigh'},{text:'End-of-day housekeeping',tag:'safety'}],
  2:[{text:'Load saw house with rail for cutting & grading',tag:'saw'},{text:'Move / spot railcars per yard manager',tag:'rail'},{text:'Sort scrap material to correct bins',tag:'sort'},{text:'Load trucks with scrap material',tag:'truck'},{text:'Weigh railcars as needed',tag:'weigh'}],
  3:[{text:'Unload railcar — verify material type first',tag:'rail'},{text:'Weigh railcars at scale',tag:'weigh'},{text:'Sort unloaded materials to assigned bins',tag:'sort'},{text:'Load saw house with rail as instructed',tag:'saw'},{text:'Spot railcars as needed',tag:'rail'}],
  4:[{text:'Move railcars per dispatch instructions',tag:'rail'},{text:'Load trucks with plug rail — confirm grade',tag:'truck'},{text:'Weigh railcars at scale',tag:'weigh'},{text:'Sort tie plates, joint bars, anchors',tag:'sort'},{text:'Load saw house with rail for afternoon cutting',tag:'saw'}],
  5:[{text:'Sort and move miscellaneous railroad materials',tag:'sort'},{text:'Load trucks with scrap or plug rail as assigned',tag:'truck'},{text:'Spot remaining railcars for the week',tag:'rail'},{text:'Weigh any outstanding railcars',tag:'weigh'},{text:'End-of-week full yard cleanup',tag:'safety'}],
  6:[{text:'Weekend standby — check in with yard manager',tag:'safety'}],
  0:[{text:'Day off',tag:'safety'}],
};

const TAGS=[{id:'truck',label:'truck load'},{id:'rail',label:'railcar'},{id:'weigh',label:'weigh'},{id:'saw',label:'saw house'},{id:'sort',label:'sorting'},{id:'safety',label:'safety'}];

let tasks=[];
let selTag='truck';
let selWkDay=(DOW===0||DOW===6)?1:DOW;
let synced=false;
let weekCache={};

function setSyncDot(state){
  const d=document.getElementById('sync-dot');
  d.className='sync-dot'+(state==='live'?' live':state==='saving'?' saving':'');
}

function makeFreshTasks(dow){
  return (DEF_TASKS[dow]||[]).map(t=>({
    id:Date.now()+Math.random(),
    text:t.text,tag:t.tag,done:false,
    sub:(SUBTASKS[t.tag]||[]).slice(),
    subDone:(SUBTASKS[t.tag]||[]).map(()=>false),
    open:false,
    completedAt:null
  }));
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// INIT — load today's tasks from Firebase, fallback to defaults
const todayRef=ref(db,`tasks/jacob/${dateKey}`);
onValue(todayRef,(snap)=>{
  const data=snap.val();
  if(data&&Array.isArray(data)){
    tasks=data;
  } else if(!synced){
    tasks=makeFreshTasks(DOW);
    set(todayRef,tasks);
  }
  synced=true;
  setSyncDot('live');
  renderTasks();
  renderWeek();
});

function saveToFirebase(){
  setSyncDot('saving');
  set(todayRef,tasks).then(()=>setSyncDot('live'));
}

// HEADER
document.getElementById('today-lbl').textContent=DF[DOW];
document.getElementById('today-sub').textContent=today.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
document.getElementById('hdr-sub').textContent=today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · WECO/Millard Yard';

// TASKS
function renderTasks(){
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const pct=total?Math.round(done/total*100):0;
  const circ=2*Math.PI*17;
  document.getElementById('ring-c').style.strokeDashoffset=circ-(circ*pct/100);
  document.getElementById('ring-n').textContent=pct+'%';

  const el=document.getElementById('task-list');
  if(!tasks.length){el.innerHTML='<div class="empty">No tasks — add one below.</div>';return;}
  el.innerHTML='';

  tasks.forEach((t,i)=>{
    const hasSub=t.sub&&t.sub.length>0;
    const subDoneCount=t.subDone?t.subDone.filter(Boolean).length:0;
    const subTotal=t.sub?t.sub.length:0;
    const row=document.createElement('div');
    row.innerHTML=`
      <div class="task-row">
        <div class="chk ${t.done?'done':''}" data-action="toggle" data-i="${i}"><i class="ti ti-check"></i></div>
        <div class="task-body" data-action="${hasSub?'expand':'toggle'}" data-i="${i}">
          <div class="task-txt ${t.done?'done':''}" data-action="edit" data-i="${i}">${esc(t.text)}</div>
          <div class="task-meta">
            <span class="tag tag-${t.tag}">${t.tag}</span>
            ${hasSub?`<button class="expand-btn" data-action="expand" data-i="${i}">${subDoneCount}/${subTotal} steps ${t.open?'▲':'▼'}</button>`:''}
            ${t.completedAt?`<span style="font-size:10px;color:var(--hint);font-family:'DM Mono',monospace">✓ ${t.completedAt}</span>`:''}
          </div>
        </div>
        <button class="del-btn" data-action="del" data-i="${i}" aria-label="Delete"><i class="ti ti-trash"></i></button>
      </div>`;
    if(hasSub&&t.open){
      const sp=document.createElement('div');
      sp.className='subtask-panel';
      sp.innerHTML=t.sub.map((s,j)=>`
        <div class="sub-row">
          <div class="sub-chk ${t.subDone[j]?'done':''}" data-action="subtoggle" data-i="${i}" data-j="${j}"><i class="ti ti-check"></i></div>
          <div class="sub-txt ${t.subDone[j]?'done':''}" data-action="subedit" data-i="${i}" data-j="${j}">${esc(s)}</div>
        </div>`).join('');
      row.appendChild(sp);
    }
    el.appendChild(row);
  });

  document.getElementById('tag-sel').innerHTML=TAGS.map(t=>
    `<div class="tag-opt tag-${t.id}${selTag===t.id?' sel':''}" data-tag="${t.id}">${t.label}</div>`
  ).join('');
}

document.getElementById('task-list').addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(!el)return;
  const action=el.dataset.action;
  const i=parseInt(el.dataset.i);
  if(action==='toggle'){
    tasks[i].done=!tasks[i].done;
    tasks[i].completedAt=tasks[i].done?new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):null;
    saveToFirebase();renderTasks();renderWeek();
  }
  else if(action==='expand'){tasks[i].open=!tasks[i].open;saveToFirebase();renderTasks();}
  else if(action==='del'){tasks.splice(i,1);saveToFirebase();renderTasks();renderWeek();}
  else if(action==='edit'){
    const inp=document.createElement('input');
    inp.className='edit-input';inp.value=tasks[i].text;
    el.replaceWith(inp);inp.focus();inp.select();
    const commit=()=>{const v=inp.value.trim();if(v)tasks[i].text=v;saveToFirebase();renderTasks();};
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e2=>{if(e2.key==='Enter')inp.blur();else if(e2.key==='Escape')renderTasks();});
  }
  else if(action==='subtoggle'){
    const j=parseInt(el.dataset.j);
    tasks[i].subDone[j]=!tasks[i].subDone[j];
    if(tasks[i].subDone.every(Boolean)){tasks[i].done=true;tasks[i].completedAt=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
    else{tasks[i].done=false;tasks[i].completedAt=null;}
    saveToFirebase();renderTasks();renderWeek();
  }
  else if(action==='subedit'){
    const j=parseInt(el.dataset.j);
    const inp=document.createElement('input');
    inp.className='sub-edit-input';inp.value=tasks[i].sub[j];
    el.replaceWith(inp);inp.focus();inp.select();
    const commit=()=>{const v=inp.value.trim();if(v)tasks[i].sub[j]=v;saveToFirebase();renderTasks();};
    inp.addEventListener('blur',commit);
    inp.addEventListener('keydown',e2=>{if(e2.key==='Enter')inp.blur();else if(e2.key==='Escape')renderTasks();});
  }
});

document.getElementById('tag-sel').addEventListener('click',function(e){
  const el=e.target.closest('[data-tag]');
  if(!el)return;
  selTag=el.dataset.tag;
  document.querySelectorAll('.tag-opt').forEach(t=>t.classList.remove('sel'));
  el.classList.add('sel');
});

function addTask(){
  const inp=document.getElementById('new-input');
  const v=inp.value.trim();if(!v)return;
  const sub=SUBTASKS[selTag]?SUBTASKS[selTag].slice():null;
  tasks.push({id:Date.now(),text:v,tag:selTag,done:false,sub:sub,subDone:sub?sub.map(()=>false):null,open:false,completedAt:null});
  saveToFirebase();inp.value='';renderTasks();
}
document.getElementById('new-input').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

// WEEK
async function renderWeek(){
  const grid=document.getElementById('week-grid');
  grid.innerHTML='';
  const mon=new Date(today);
  mon.setDate(today.getDate()-((DOW+6)%7));
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const dw=d.getDay();
    const dk=d.toISOString().slice(0,10);
    let dayTasks=[];
    if(dk===dateKey){dayTasks=tasks;}
    else if(weekCache[dk]){dayTasks=weekCache[dk];}
    else{
      const snap=await get(ref(db,`tasks/jacob/${dk}`));
      dayTasks=snap.val()||[];
      weekCache[dk]=dayTasks;
    }
    const isT=dw===DOW,isSel=dw===selWkDay,hasT=dayTasks.length>0;
    const c=document.createElement('div');
    c.className='dc'+(isT?' today':'')+(isSel&&!isT?' sel':'')+(hasT?' has-t':'');
    c.innerHTML=`<span class="dc-d">${DS[dw]}</span><span class="dc-n">${d.getDate()}</span><span class="dc-dot"></span>`;
    c.onclick=()=>{selWkDay=dw;renderWeek();};
    grid.appendChild(c);
  }
  renderWkTasks();
}

async function renderWkTasks(){
  document.getElementById('wk-lbl').textContent=DF[selWkDay]+' tasks';
  const mon=new Date(today);
  mon.setDate(today.getDate()-((DOW+6)%7));
  const offset=(selWkDay-((DOW+6)%7===6?0:1)+7)%7;
  const d=new Date(mon);d.setDate(mon.getDate()+((selWkDay+6)%7));
  const dk=d.toISOString().slice(0,10);

  let dayTasks=dk===dateKey?tasks:(weekCache[dk]||[]);
  if(!dayTasks.length&&dk!==dateKey){
    const snap=await get(ref(db,`tasks/jacob/${dk}`));
    dayTasks=snap.val()||[];
    weekCache[dk]=dayTasks;
  }

  const el=document.getElementById('wk-tasks');
  if(!dayTasks.length){el.innerHTML='<div class="empty">No tasks scheduled.</div>';return;}
  el.innerHTML='';
  dayTasks.forEach(t=>{
    const subDoneCount=t.subDone?t.subDone.filter(Boolean).length:0;
    const subTotal=t.sub?t.sub.length:0;
    const r=document.createElement('div');
    r.className='task-row';r.style.cursor='default';
    r.innerHTML=`
      <div class="chk ${t.done?'done':''}"><i class="ti ti-check"></i></div>
      <div class="task-body">
        <div class="task-txt ${t.done?'done':''}">${esc(t.text)}</div>
        <div class="task-meta">
          <span class="tag tag-${t.tag}">${t.tag}</span>
          ${subTotal?`<span style="font-size:10px;color:var(--hint);font-family:'DM Mono',monospace">${subDoneCount}/${subTotal}</span>`:''}
          ${t.completedAt?`<span style="font-size:10px;color:var(--hint);font-family:'DM Mono',monospace">✓ ${t.completedAt}</span>`:''}
        </div>
      </div>`;
    el.appendChild(r);
  });
}

function sw(tab,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-'+tab).classList.add('active');
}
window.sw=sw;
window.addTask=addTask;
</script>
</body>
</html>
